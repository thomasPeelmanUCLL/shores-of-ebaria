apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shores-of-ebaria-website
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/thomasPeelmanUCLL/shores-of-ebaria.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: shores-of-ebaria
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
