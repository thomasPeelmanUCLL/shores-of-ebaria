apiVersion: apps/v1
kind: Deployment
metadata:
  name: shores-of-eberia-website
  namespace: shores-of-eberia
  labels:
    app: shores-of-eberia-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shores-of-eberia-website
  template:
    metadata:
      labels:
        app: shores-of-eberia-website
    spec:
      containers:
        - name: website
          image: ghcr.io/stray-gleb-tanakov/shores-of-ebaria:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi