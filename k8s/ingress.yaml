apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shores-of-ebaria-website-ingress
  namespace: shores-of-ebaria
spec:
  ingressClassName: nginx
  rules:
    - host: shores-of-ebaria.dev # replace with your real domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shores-of-ebaria-website
                port:
                  number: 80
